<!doctype html>
<html lang="fr"{% if theme %} data-theme="{{ theme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="jeton" content="{{ jeton }}">
<title>LMAgent — {% block titre %}{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <!-- Logo horizontal (static/logo-wide.png, généré par outils/generer_logo.py) ; le texte alt reste pour les lecteurs d'écran -->
  <a href="/" class="marque" title="Tableau de bord"><img src="{{ url_for('static', filename='logo-wide.png') }}" alt="LMAgent" height="40"></a>
  <a href="/" class="{{ 'actif' if page == 'accueil' }}">Tableau de bord</a>
  <a href="/suivi" class="{{ 'actif' if page == 'suivi' }}">Suivi</a>
  <a href="/postuler" class="{{ 'actif' if page == 'postuler' }}">À postuler</a>
  <a href="/ecartees" class="{{ 'actif' if page == 'ecartees' }}" title="Entreprises écartées par le filtre d'activité">Écartées</a>
  <a href="/routines" class="{{ 'actif' if page == 'routines' }}">Routines</a>
  {% if avec_tour %}<a href="/tour" class="{{ 'actif' if page == 'tour' }}">Tour</a>{% endif %}
  <a href="/linkedin" class="{{ 'actif' if page == 'linkedin' }}">LinkedIn</a>
  <a href="/journal" class="{{ 'actif' if page == 'journal' }}">Journal</a>
  <a href="/parametres" class="{{ 'actif' if page == 'parametres' }}">Paramètres</a>
  {% if connecte %}<span class="utilisateur" title="Compte connecté">👤 {{ connecte }}</span><button class="deconnexion" onclick="deconnecter()" title="Se déconnecter ({{ connecte }})">Se déconnecter</button>{% endif %}
  <button class="quitter" onclick="quitter()" title="Arrêter l'interface">⏻ Quitter</button>
</nav>
<main class="{% block largeur %}{% endblock %}">{% block contenu %}{% endblock %}</main>
<div id="message" class="message"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block script %}{% endblock %}
</body>
</html>
