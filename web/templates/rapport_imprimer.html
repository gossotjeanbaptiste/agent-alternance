<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ infos.libelle if infos else 'Rapport de recherche' }}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
<style>
  /* Le rapport seul, prêt à imprimer ou à enregistrer en PDF : toujours en clair, mise en page de document */
  :root { color-scheme: light; }
  body { margin: 0; background: #f2f1ed; color: #1d1d1b; font: 15px/1.6 Georgia, "Times New Roman", serif; }
  .feuille { max-width: 780px; margin: 24px auto; background: #fff; padding: 56px 64px; box-shadow: 0 2px 16px rgba(0,0,0,.08); }
  h2 { font-size: 24px; margin: 0 0 6px; } h3 { font-size: 18px; margin: 26px 0 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  h4 { font-size: 16px; margin: 18px 0 6px; } p { margin: 8px 0; text-align: justify; } ul { padding-left: 22px; } li { margin: 3px 0; }
  .outils { max-width: 780px; margin: 16px auto 0; display: flex; gap: 8px; justify-content: flex-end; font-family: system-ui, sans-serif; }
  .outils button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  .outils button.principal { background: #534ab7; color: #fff; border-color: #534ab7; }
  @page { margin: 18mm 16mm; }
  @media print {
    body { background: #fff; } .outils { display: none; }
    .feuille { box-shadow: none; margin: 0; padding: 0; max-width: none; }
    h3 { break-after: avoid; } li, p { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="outils">
  <button onclick="window.close()">Fermer</button>
  <button class="principal" onclick="window.print()" title="Choisis « Enregistrer au format PDF » comme imprimante pour obtenir un PDF">🖨️ Imprimer / Enregistrer en PDF</button>
</div>
<div class="feuille">{{ ia_html }}</div>
<script>window.addEventListener("load", () => setTimeout(() => window.print(), 300));</script>
</body>
</html>
