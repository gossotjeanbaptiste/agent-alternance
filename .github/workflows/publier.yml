# Publication d'une version : pousser un tag vX.Y.Z (ex. git tag v1.2.0 && git push origin v1.2.0)
# -> tests (tests.yml, l'installeur n'est fabriqué que s'ils passent), compilation de LMAgent.exe (PyInstaller), installeur LMAgent-X.Y.Z.msi (WiX), empreinte SHA-256,
#    et création de la version GitHub avec ces fichiers. Les installations existantes s'y mettent à jour seules.
name: Publier une version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # essai manuel : fabrique l'installeur (artefact) sans publier de version

permissions:
  contents: write

jobs:
  tests:                  # tous les tests d'abord (workflow tests.yml) : pas d'installeur si l'un échoue
    uses: ./.github/workflows/tests.yml

  installeur:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt pyinstaller

      - name: Numéro de version (depuis le tag)
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag invalide : $v (attendu vX.Y.Z)" }
          "`"`"`"Version de LMAgent (remplacée automatiquement lors de la publication).`"`"`"`n__version__ = `"$v`"" |
            Set-Content src/version.py -Encoding utf8
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilation (PyInstaller)
        run: python -m PyInstaller installeur/LMAgent.spec --noconfirm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installeur (WiX)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $dist = (Resolve-Path dist/LMAgent).Path      # chemin ABSOLU (sinon WiX cherche depuis installeur/)
          wix build installeur/LMAgent.wxs -arch x64 -d Version=$env:VERSION -d Dist=$dist -o dist/LMAgent-$env:VERSION.msi

      - name: Vérification de l'installeur
        shell: pwsh
        run: |
          $msi = Get-Item "dist/LMAgent-$env:VERSION.msi"
          $exe = (Get-ChildItem dist/LMAgent -Recurse -File | Measure-Object Length -Sum).Sum
          "Installeur : $([math]::Round($msi.Length / 1MB, 1)) Mo ; application compilée : $([math]::Round($exe / 1MB, 1)) Mo"
          if ($msi.Length -lt 10MB) { throw "Installeur trop petit : les fichiers de l'application n'y sont pas." }

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          $msi = "dist/LMAgent-$env:VERSION.msi"
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$h  LMAgent-$env:VERSION.msi" | Set-Content "$msi.sha256" -Encoding ascii -NoNewline

      - name: Installeur d'essai (déclenchement manuel)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installeur-essai
          path: dist/LMAgent-*.msi*

      - name: Version GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: LMAgent ${{ github.ref_name }}
          files: |
            dist/LMAgent-*.msi
            dist/LMAgent-*.msi.sha256
          body: |
            Installeur Windows : télécharge `LMAgent-*.msi` et lance-le (installation pour ton compte, sans droits
            administrateur). Windows peut afficher « éditeur inconnu » : l'installeur n'est pas signé.
            Les installations existantes se mettent à jour toutes seules (désactivable dans Paramètres).
